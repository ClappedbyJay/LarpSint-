<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Passwort zurücksetzen | LarpSint</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #000000;
            --surface: rgba(3, 8, 15, 0.85);
            --surface-2: rgba(10, 25, 41, 0.9);
            --text: #edf4ff;
            --muted: #82a8c4;
            --accent: #cc1f2d;
            --accent-blue: #41d8ff;
            --border: rgba(204, 31, 45, 0.15);
            --shadow: rgba(0, 0, 0, 0.7);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, Arial, sans-serif;
            background: radial-gradient(circle at center, rgba(204,31,45,0.08), transparent 25%),
                        linear-gradient(180deg, #000000 0%, #02050d 100%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
        }

        /* Radar Background Elements */
        .radar-backdrop {
            position: fixed;
            inset: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 0;
        }
        .radar-grid {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle, rgba(204,31,45,0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(204,31,45,0.03) 1px, transparent 1px),
                              linear-gradient(180deg, rgba(204,31,45,0.03) 1px, transparent 1px);
            background-size: 80px 80px, 100% 100%, 100% 100%;
            opacity: 0.4;
        }
        .radar-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(204,31,45,0.15);
        }
        .ring-1 { width: 800px; height: 800px; }
        .ring-2 { width: 500px; height: 500px; }
        .radar-sweep {
            position: absolute;
            width: 1000px;
            height: 1000px;
            background: conic-gradient(from 0deg, transparent 0%, rgba(204,31,45,0.15) 10%, transparent 20%);
            animation: rotate 10s linear infinite;
            border-radius: 50%;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Lightning Effects */
        .bolt {
            position: fixed;
            top: -10%;
            width: 2px;
            height: 120%;
            opacity: 0;
            animation: lightning 8s infinite;
            pointer-events: none;
        }
        .bolt span {
            position: absolute;
            width: 100%;
            height: 30%;
            background: linear-gradient(180deg, transparent, var(--accent-blue), transparent);
            box-shadow: 0 0 15px var(--accent-blue);
        }
        .bolt-1 { left: 15%; animation-delay: 1s; }
        .bolt-2 { left: 85%; animation-delay: 4s; }
        @keyframes lightning {
            0%, 95%, 100% { opacity: 0; }
            96% { opacity: 0.8; }
            97% { opacity: 0.2; }
            98% { opacity: 1; }
        }

        .card {
            position: relative;
            z-index: 1;
            width: min(520px, 100%);
            background: var(--surface-2);
            border: 1px solid rgba(65, 216, 255, 0.15);
            border-radius: 32px;
            padding: 2rem;
            box-shadow: 0 40px 100px var(--shadow);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        form {
            width: 100%;
            max-width: 480px;
        }
        h1 {
            margin: 0 0 0.5rem;
            font-size: clamp(2rem, 4vw, 2.8rem);
            text-align: center;
        }
        p {
            margin: 0 0 1.5rem;
            color: var(--muted);
            line-height: 1.7;
            text-align: center;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.35rem;
            color: var(--muted);
            font-size: 0.95rem;
        }
        input {
            width: 100%;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 1rem 1.1rem;
            background: rgba(255,255,255,0.04);
            color: var(--text);
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: rgba(255,255,255,0.08);
        }
        .button-primary {
            width: 100%;
            border: none;
            border-radius: 999px;
            padding: 1rem 1.8rem;
            background: linear-gradient(135deg, var(--accent-blue) 0%, #2a99ff 100%);
            color: #06101a;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin: 0.75rem auto 0;
            display: block;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .button-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 30px rgba(65, 216, 255, 0.3);
        }
        .message {
            min-height: 1.3rem;
            margin-top: 1rem;
            color: #8eda8d;
            font-size: 0.95rem;
            text-align: center;
        }
        /* Passwort-Sichtbarkeit Toggle */
        .password-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }
        .password-wrapper input {
            padding-right: 3.5rem !important;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 1.2rem;
            z-index: 10;
            padding: 0;
            line-height: 1;
            outline: none;
        }
        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 0.95rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="radar-backdrop">
        <div class="radar-grid"></div>
        <div class="radar-ring ring-1"></div>
        <div class="radar-ring ring-2"></div>
        <div class="radar-sweep"></div>
    </div>
    <div class="bolt bolt-1"><span></span></div>
    <div class="bolt bolt-2"><span></span></div>

    <div class="card">
        <h1>Passwort zurücksetzen</h1>
        <p>Gib deine Email ein und setze ein neues Passwort für dein Konto.</p>

        <form id="reset-form">
            <div class="form-group">
                <label for="reset-email">Email-Adresse</label>
                <input type="email" id="reset-email" required placeholder="deine@adresse.de">
            </div>
            <div class="form-group">
                <label for="new-password">Neues Passwort</label>
                <div class="password-wrapper">
                    <input type="password" id="new-password" required placeholder="Mindestens 8 Zeichen">
                    <button type="button" class="toggle-password" onclick="togglePass('new-password', this)">👁️</button>
                </div>
            </div>
            <div class="form-group">
                <label for="confirm-password">Passwort wiederholen</label>
                <div class="password-wrapper">
                    <input type="password" id="confirm-password" required placeholder="Passwort wiederholen">
                    <button type="button" class="toggle-password" onclick="togglePass('confirm-password', this)">👁️</button>
                </div>
            </div>
            <button type="submit" class="button-primary">Passwort zurücksetzen</button>
            <div class="message" id="reset-message"></div>
        </form>

        <a class="back-link" href="Anmeldung.html">Zurück zur Anmeldung</a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            autoCleanup();
        });

        function autoCleanup() {
            const lastCleanup = localStorage.getItem('larpsint_last_cleanup');
            const now = Date.now();
            const ONE_HOUR = 3600000;

            if (!lastCleanup || (now - lastCleanup > ONE_HOUR)) {
                const keysToKeep = [
                    'opensight-users',
                    'opensight-current-user',
                    'larpsint_locks',
                    'opensight-last-email',
                    'osight_notes_storage',
                    'osight_cookie_consent'
                ];

                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (!keysToKeep.includes(key) && key !== 'larpsint_last_cleanup') {
                        localStorage.removeItem(key);
                        i--;
                    }
                }

                localStorage.setItem('larpsint_last_cleanup', now);
            }
        }

        function togglePass(id, btn) {
            const input = document.getElementById(id);
            const isPass = input.type === 'password';
            input.type = isPass ? 'text' : 'password';
            btn.textContent = isPass ? '🙈' : '👁️';
        }

        function getUsers() {
            const raw = localStorage.getItem('opensight-users');
            return raw ? JSON.parse(raw) : [];
        }

        function saveUsers(users) {
            localStorage.setItem('opensight-users', JSON.stringify(users));
        }

        const resetForm = document.getElementById('reset-form');
        const resetMessage = document.getElementById('reset-message');

        resetForm.addEventListener('submit', event => {
            event.preventDefault();
            const email = document.getElementById('reset-email').value.trim().toLowerCase();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const users = getUsers();

            if (!email || !newPassword || !confirmPassword) {
                resetMessage.style.color = '#f18787';
                resetMessage.textContent = 'Bitte alle Felder ausfüllen.';
                return;
            }
            if (newPassword.length < 8) {
                resetMessage.style.color = '#f18787';
                resetMessage.textContent = 'Das Passwort muss mindestens 8 Zeichen lang sein.';
                return;
            }
            if (newPassword !== confirmPassword) {
                resetMessage.style.color = '#f18787';
                resetMessage.textContent = 'Die Passwörter stimmen nicht überein.';
                return;
            }

            const userIndex = users.findIndex(user => user.email === email);
            if (userIndex === -1) {
                resetMessage.style.color = '#f18787';
                resetMessage.textContent = 'Kein Konto mit dieser Email gefunden.';
                return;
            }

            users[userIndex].password = newPassword;
            saveUsers(users);
            resetMessage.style.color = '#8eda8d';
            resetMessage.textContent = 'Passwort wurde zurückgesetzt. Du kannst dich jetzt anmelden.';
            setTimeout(() => {
                window.location.href = 'Anmeldung.html';
            }, 1400);
        });
    </script>
</body>
</html>
